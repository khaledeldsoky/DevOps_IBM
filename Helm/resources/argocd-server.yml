apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
  mamespace: argocd
  labels:
    app: argocd-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: argocd-server
  template:
    metadata:
      labels:
        app: argocd-server
    spec:
      containers:
      - name: argocd-server
        image: quay.io/argoproj/argocd:v2.12.0
        ports:
        - containerPort: 8080
        command: ["argocd-server"]
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-server
  namespace: argocd
  labels:
    app: argocd-server
spec:
  type: NodePort
  selector:
    app: argocd-server
  ports:
    - port: 80
      targetPort: 8080
      nodeport: 30010

