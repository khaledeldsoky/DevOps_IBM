apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "argocd.fullname" . }}-dex-server
  namespace: {{ .Values.namespace }}
  labels:
    app: argocd-dex-server
spec:
  replicas: {{ .Values.dex.replicaCount }}
  selector:
    matchLabels:
      app: argocd-dex-server
  template:
    metadata:
      labels:
        app: argocd-dex-server
    spec:
      containers:
      - name: argocd-dex-server
        image: "{{ .Values.dex.image.repository }}:{{ .Values.dex.image.tag }}"

---
ubuntu@master-instance:~$ cat Helm/templates/argocd-dex-server.yaml 
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "argocd.fullname" . }}-dex-server
  namespace: {{ .Values.namespace }}
  labels:
    app: argocd-dex-server
spec:
  replicas: {{ .Values.dex.replicaCount }}
  selector:
    matchLabels:
      app: argocd-dex-server
  template:
    metadata:
      labels:
        app: argocd-dex-server
    spec:
      serviceAccountName: argocd-dex-server
      containers:
      - name: argocd-dex-server
        image: "{{ .Values.dex.image.repository }}:{{ .Values.dex.image.tag }}"
        args:
        - serve
        - /etc/dex/cfg/config.yaml
        volumeMounts:
        - name: dex-config
          mountPath: /etc/dex/cfg
      volumes:
      - name: dex-config
        configMap:
          name: {{ include "argocd.fullname" . }}-dex-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "argocd.fullname" . }}-dex-config
  namespace: {{ .Values.namespace }}
data:
  config.yaml: |
    issuer: http://{{ include "argocd.fullname" . }}-dex-server:5556/dex
    storage:
      type: kubernetes
      config:
        inCluster: true
    web:
      http: 0.0.0.0:5556
    grpc:
      addr: 0.0.0.0:5557
    staticClients:
    - id: argocd
      redirectURIs:
      - http://{{ include "argocd.fullname" . }}-server:80/auth/callback
      name: Argo CD
      secret: argocd-secret
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-dex-server
  namespace: argocd
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-dex-server
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-dex-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-dex-server
subjects:
  - kind: ServiceAccount
    name: argocd-dex-server
    namespace: argocd